<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password - CSRF Shield</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <div class="brand"><span class="shield">🛡️</span> CSRF Shield</div>
    <nav>
        <a th:href="@{/dashboard}">Home</a>
        <a th:href="@{/profile}">Profile</a>
        <a th:href="@{/password}" class="active">Password</a>
        <a th:href="@{/transfer}">Transfer</a>
        <a th:href="@{/security-dashboard}">Security Dashboard</a>
        <a th:href="@{/attack}">Attack Lab</a>
        <a th:href="@{/integration}">Integrations</a>
    </nav>
</div>
<div class="container" style="max-width:520px;">
    <div class="card">
        <h2>Change Password</h2>
        <div class="alert success" th:if="${param.updated != null}">Password changed. Your CSRF token was rotated.</div>

        <form method="post" th:action="@{/password/change}">
            <input type="hidden" name="_csrf" th:value="${csrfToken}">
            <label>New Password</label>
            <input type="password" name="newPassword" required minlength="8">
            <button type="submit">Update Password</button>
        </form>
    </div>
</div>
</body>
</html>
