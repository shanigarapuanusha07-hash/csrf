server.port=8080
spring.thymeleaf.cache=false
spring.application.name=CSRF Shield

# App-level security tunables (read by AppMode / CsrfTokenManager)
csrf.token.expiry.seconds=300
csrf.bind.ip=true
csrf.bind.useragent=true

# Set to true only when testing behind HTTPS locally (browsers reject
# Secure cookies over plain http://localhost in some configurations)
csrf.cookies.secure=false
